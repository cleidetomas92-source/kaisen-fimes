<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>Kaisen Filmes | Cinema em casa</title>
  <!-- Font Awesome para ícones (opcional, mas ajuda no visual) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    /* ========== RESET E VARIÁVEIS ========== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
    }

    :root {
      --bg-dark: #0a0c10;
      --bg-card: #14181f;
      --bg-header: #0f1217;
      --accent: #e50914;
      --accent-hover: #ff2a2a;
      --text-light: #f5f5f7;
      --text-muted: #a0a5b0;
      --border-radius: 16px;
      --card-radius: 18px;
      --shadow: 0 12px 28px rgba(0, 0, 0, 0.7);
      --transition: 0.25s ease;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-light);
      line-height: 1.5;
      padding-bottom: 2rem;
    }

    /* ========== CABEÇALHO ========== */
    header {
      background-color: var(--bg-header);
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
      border-bottom: 1px solid #222831;
    }

    .header-container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 1rem 1.5rem;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    .logo {
      font-size: 1.8rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #ffffff 0%, #e50914 80%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .logo i {
      color: var(--accent);
      -webkit-text-fill-color: var(--accent);
      font-size: 1.9rem;
    }

    /* Menu responsivo */
    .menu-toggle {
      display: none;
      background: transparent;
      border: 1px solid #333a44;
      color: white;
      font-size: 1.8rem;
      padding: 0.4rem 1rem;
      border-radius: 12px;
      cursor: pointer;
      transition: var(--transition);
    }

    .menu-toggle:hover {
      background: #1e232b;
    }

    nav ul {
      display: flex;
      list-style: none;
      gap: 1.8rem;
      align-items: center;
    }

    nav a {
      color: var(--text-light);
      text-decoration: none;
      font-weight: 500;
      font-size: 1.05rem;
      transition: var(--transition);
      padding-bottom: 4px;
      border-bottom: 2px solid transparent;
    }

    nav a:hover, nav a.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
    }

    .search-box {
      display: flex;
      align-items: center;
      background: #1e232b;
      border-radius: 40px;
      padding: 0.3rem 0.3rem 0.3rem 1rem;
      border: 1px solid #2a313c;
      transition: var(--transition);
    }

    .search-box:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(229, 9, 20, 0.3);
    }

    .search-box input {
      background: transparent;
      border: none;
      padding: 0.6rem 0.3rem;
      color: white;
      font-size: 0.95rem;
      width: 160px;
      outline: none;
    }

    .search-box input::placeholder {
      color: var(--text-muted);
    }

    .search-box button {
      background: var(--accent);
      border: none;
      color: white;
      padding: 0.6rem 1.2rem;
      border-radius: 30px;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .search-box button:hover {
      background: var(--accent-hover);
    }

    /* ========== BANNER PRINCIPAL ========== */
    .hero {
      max-width: 1400px;
      margin: 2rem auto 1rem;
      padding: 0 1.5rem;
    }

    .hero-banner {
      background: linear-gradient(90deg, #0b0e13 30%, rgba(10, 12, 16, 0.6) 100%),
                  url('https://images.unsplash.com/photo-1536440136628-849c177e76a1?q=80&w=1925&auto=format&fit=crop') center/cover no-repeat;
      border-radius: 28px;
      padding: 3.5rem 2.5rem;
      min-height: 300px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      box-shadow: var(--shadow);
      border: 1px solid #2b313c;
    }

    .hero-banner h1 {
      font-size: clamp(2rem, 8vw, 3.5rem);
      font-weight: 800;
      line-height: 1.2;
      max-width: 600px;
      text-shadow: 0 4px 20px rgba(0,0,0,0.8);
    }

    .hero-banner p {
      font-size: 1.2rem;
      color: #ddd;
      margin: 1rem 0 1.8rem;
      max-width: 500px;
    }

    .hero-btn {
      background: var(--accent);
      color: white;
      border: none;
      padding: 1rem 2.2rem;
      border-radius: 50px;
      font-weight: 700;
      font-size: 1.1rem;
      width: fit-content;
      cursor: pointer;
      transition: var(--transition);
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 8px 18px rgba(229, 9, 20, 0.4);
    }

    .hero-btn:hover {
      background: var(--accent-hover);
      transform: scale(1.02);
    }

    /* ========== TÍTULOS DE SEÇÃO ========== */
    .section-title {
      max-width: 1400px;
      margin: 2.5rem auto 1rem;
      padding: 0 1.5rem;
      font-size: 1.9rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 12px;
      letter-spacing: -0.5px;
    }

    .section-title i {
      color: var(--accent);
      font-size: 2rem;
    }

    /* ========== FILTROS DE CATEGORIA ========== */
    .categories-filter {
      max-width: 1400px;
      margin: 0 auto 1rem;
      padding: 0 1.5rem;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    .cat-btn {
      background: #1a1f28;
      border: 1px solid #2d3542;
      color: #ddd;
      padding: 0.7rem 1.5rem;
      border-radius: 40px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      transition: var(--transition);
      white-space: nowrap;
    }

    .cat-btn:hover {
      background: #2a313c;
      border-color: #4a5260;
    }

    .cat-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: white;
    }

    /* ========== GRELHA DE FILMES ========== */
    .movies-grid {
      max-width: 1400px;
      margin: 1.5rem auto 3rem;
      padding: 0 1.5rem;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 1.8rem;
    }

    /* CARTÃO DE FILME */
    .movie-card {
      background: var(--bg-card);
      border-radius: var(--card-radius);
      overflow: hidden;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      box-shadow: 0 6px 14px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      border: 1px solid #232a34;
      cursor: default;
    }

    .movie-card:hover {
      transform: translateY(-8px);
      box-shadow: 0 18px 30px rgba(0, 0, 0, 0.8);
      border-color: #3d4553;
    }

    .card-img {
      width: 100%;
      aspect-ratio: 2 / 3;
      object-fit: cover;
      background: #1e232b;
      display: block;
    }

    .card-info {
      padding: 1rem 0.9rem 1.2rem;
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .card-title {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 0.3rem;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-meta {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 0.9rem;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .card-meta span {
      background: #1e232b;
      padding: 0.2rem 0.7rem;
      border-radius: 30px;
      font-size: 0.75rem;
    }

    .btn-details {
      background: transparent;
      border: 1.5px solid var(--accent);
      color: var(--accent);
      padding: 0.7rem 0.8rem;
      border-radius: 40px;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s ease;
      margin-top: auto;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: 100%;
    }

    .btn-details:hover {
      background: var(--accent);
      color: white;
      box-shadow: 0 0 18px rgba(229, 9, 20, 0.6);
    }

    /* ========== PÁGINA DE DETALHES (MODAL) ========== */
    .details-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.9);
      backdrop-filter: blur(10px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 1.2rem;
    }

    .details-modal.open {
      display: flex;
    }

    .details-content {
      background: #12171f;
      max-width: 900px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      border-radius: 32px;
      padding: 1.8rem;
      border: 1px solid #2e3642;
      box-shadow: var(--shadow);
      position: relative;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.96); }
      to { opacity: 1; transform: scale(1); }
    }

    .details-close {
      position: absolute;
      top: 1.2rem;
      right: 1.5rem;
      background: #232a34;
      border: none;
      color: white;
      font-size: 1.8rem;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: var(--transition);
    }

    .details-close:hover {
      background: var(--accent);
      transform: rotate(90deg);
    }

    .details-layout {
      display: flex;
      gap: 2rem;
      flex-wrap: wrap;
      margin-top: 1rem;
    }

    .details-poster {
      flex: 1 1 200px;
      max-width: 260px;
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.7);
    }

    .details-poster img {
      width: 100%;
      height: auto;
      display: block;
    }

    .details-info {
      flex: 2 1 350px;
    }

    .details-info h2 {
      font-size: 2.2rem;
      font-weight: 800;
      margin-bottom: 0.4rem;
      line-height: 1.2;
    }

    .details-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin: 1rem 0;
      color: #b9c0cb;
    }

    .details-meta span {
      background: #1e2630;
      padding: 0.4rem 1rem;
      border-radius: 30px;
      font-size: 0.9rem;
      font-weight: 500;
    }

    .details-synopsis {
      color: #cfd5df;
      font-size: 1rem;
      margin: 1.2rem 0 1.8rem;
      line-height: 1.7;
      border-left: 4px solid var(--accent);
      padding-left: 1.2rem;
    }

    .details-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .btn-watch {
      background: var(--accent);
      border: none;
      color: white;
      padding: 1rem 2.2rem;
      border-radius: 50px;
      font-weight: 700;
      font-size: 1.1rem;
      cursor: pointer;
      transition: var(--transition);
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 8px 18px rgba(229, 9, 20, 0.3);
      flex: 1 0 auto;
      justify-content: center;
    }

    .btn-watch:hover {
      background: var(--accent-hover);
      transform: scale(1.02);
    }

    .btn-back {
      background: transparent;
      border: 2px solid #3a4350;
      color: white;
      padding: 1rem 2rem;
      border-radius: 50px;
      font-weight: 600;
      font-size: 1.05rem;
      cursor: pointer;
      transition: var(--transition);
      display: flex;
      align-items: center;
      gap: 8px;
      justify-content: center;
    }

    .btn-back:hover {
      background: #2a313c;
      border-color: #5a6373;
    }

    /* ========== ESTADO VAZIO ========== */
    .no-results {
      text-align: center;
      padding: 3rem 1rem;
      color: var(--text-muted);
      font-size: 1.2rem;
      grid-column: 1 / -1;
    }

    /* ========== FOOTER ========== */
    footer {
      text-align: center;
      padding: 2rem 1.5rem 1rem;
      color: #6b7280;
      border-top: 1px solid #1e232b;
      margin-top: 2rem;
      font-size: 0.9rem;
    }

    /* ========== RESPONSIVIDADE ========== */
    @media (max-width: 850px) {
      .header-container {
        padding: 0.9rem 1.2rem;
      }

      .menu-toggle {
        display: block;
        order: 2;
      }

      nav {
        order: 3;
        width: 100%;
        display: none;
      }

      nav.active {
        display: block;
      }

      nav ul {
        flex-direction: column;
        gap: 0.8rem;
        padding: 1.2rem 0 0.5rem;
        align-items: flex-start;
      }

      .search-box {
        order: 1;
        margin-left: auto;
        margin-right: 0.8rem;
      }

      .search-box input {
        width: 120px;
      }

      .search-box button span {
        display: none;
      }

      .search-box button i {
        font-size: 1rem;
      }

      .hero-banner {
        padding: 2.2rem 1.5rem;
        min-height: 260px;
      }

      .details-layout {
        flex-direction: column;
        align-items: center;
        text-align: center;
      }

      .details-poster {
        max-width: 220px;
      }

      .details-synopsis {
        border-left: none;
        padding-left: 0;
        text-align: left;
      }

      .details-info h2 {
        font-size: 1.9rem;
      }

      .details-actions {
        flex-direction: column;
      }

      .btn-watch, .btn-back {
        width: 100%;
      }
    }

    @media (max-width: 480px) {
      .header-container {
        flex-wrap: wrap;
      }

      .logo {
        font-size: 1.6rem;
      }

      .search-box input {
        width: 100px;
      }

      .movies-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 1rem;
        padding: 0 1rem;
      }

      .card-title {
        font-size: 0.95rem;
      }

      .btn-details {
        font-size: 0.75rem;
        padding: 0.6rem 0.3rem;
      }

      .section-title {
        font-size: 1.6rem;
      }

      .hero-banner h1 {
        font-size: 1.8rem;
      }

      .hero-banner p {
        font-size: 1rem;
      }
    }

    /* ========== SCROLLBAR PERSONALIZADA ========== */
    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-track {
      background: #0f1217;
    }

    ::-webkit-scrollbar-thumb {
      background: #2e3642;
      border-radius: 10px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: var(--accent);
    }
  </style>
</head>
<body>

  <!-- CABEÇALHO -->
  <header>
    <div class="header-container">
      <div class="logo">
        <i class="fas fa-film"></i> Kaisen Filmes
      </div>

      <button class="menu-toggle" id="menuToggle" aria-label="Abrir menu">
        <i class="fas fa-bars"></i>
      </button>

      <nav id="mainNav">
        <ul>
          <li><a href="#" class="active">Início</a></li>
          <li><a href="#">Filmes</a></li>
          <li><a href="#">Séries</a></li>
          <li><a href="#">Categorias</a></li>
          <li><a href="#">Sobre</a></li>
        </ul>
      </nav>

      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Pesquisar filmes...">
        <button id="searchBtn"><i class="fas fa-search"></i> <span>Buscar</span></button>
      </div>
    </div>
  </header>

  <!-- BANNER PRINCIPAL -->
  <section class="hero">
    <div class="hero-banner">
      <h1>Descubra o melhor do cinema</h1>
      <p>Filmes aclamados, clássicos e novidades para todos os gostos.</p>
      <button class="hero-btn" id="heroExploreBtn"><i class="fas fa-play"></i> Explorar agora</button>
    </div>
  </section>

  <!-- TÍTULO DA SEÇÃO -->
  <div class="section-title">
    <i class="fas fa-star"></i> Filmes em destaque
  </div>

  <!-- FILTROS DE CATEGORIA -->
  <div class="categories-filter" id="categoriesFilter">
    <button class="cat-btn active" data-category="todos">Todos</button>
    <button class="cat-btn" data-category="Ação">Ação</button>
    <button class="cat-btn" data-category="Comédia">Comédia</button>
    <button class="cat-btn" data-category="Drama">Drama</button>
    <button class="cat-btn" data-category="Terror">Terror</button>
    <button class="cat-btn" data-category="Ficção científica">Ficção científica</button>
    <button class="cat-btn" data-category="Animação">Animação</button>
    <button class="cat-btn" data-category="Romance">Romance</button>
    <button class="cat-btn" data-category="Aventura">Aventura</button>
  </div>

  <!-- GRELHA DE FILMES -->
  <div class="movies-grid" id="moviesGrid"></div>

  <!-- MODAL DE DETALHES (PÁGINA DE DETALHES) -->
  <div class="details-modal" id="detailsModal">
    <div class="details-content" id="detailsContent">
      <!-- Preenchido via JavaScript -->
    </div>
  </div>

  <!-- FOOTER -->
  <footer>
    <p>© 2025 Kaisen Filmes — Demonstração educacional. Nenhum conteúdo protegido é hospedado ou distribuído.</p>
  </footer>

  <script>

    ];

    /* ============================================================
       VARIÁVEIS GLOBAIS
    ============================================================ */
    const moviesGrid = document.getElementById('moviesGrid');
    const searchInput = document.getElementById('searchInput');
    const searchBtn = document.getElementById('searchBtn');
    const categoriesFilter = document.getElementById('categoriesFilter');
    const detailsModal = document.getElementById('detailsModal');
    const detailsContent = document.getElementById('detailsContent');
    const menuToggle = document.getElementById('menuToggle');
    const mainNav = document.getElementById('mainNav');
    const heroExploreBtn = document.getElementById('heroExploreBtn');

    let currentCategory = 'todos';
    let currentSearchTerm = '';

    /* ============================================================
       RENDERIZAR FILMES
    ============================================================ */
    function renderMovies() {
      // Filtrar por categoria e termo de pesquisa
      let filtered = moviesData.filter(movie => {
        const matchCategory = currentCategory === 'todos' || movie.category === currentCategory;
        const matchSearch = movie.title.toLowerCase().includes(currentSearchTerm.toLowerCase());
        return matchCategory && matchSearch;
      });

      // Se não houver resultados
      if (filtered.length === 0) {
        moviesGrid.innerHTML = `<div class="no-results"><i class="fas fa-search" style="font-size:2rem; display:block; margin-bottom:1rem;"></i> Nenhum filme encontrado.</div>`;
        return;
      }

      // Gerar cartões
      moviesGrid.innerHTML = filtered.map(movie => `
        <div class="movie-card" data-id="${movie.id}">
          <img class="card-img" src="${movie.poster}" alt="Capa do filme ${movie.title}" loading="lazy">
          <div class="card-info">
            <h3 class="card-title">${movie.title}</h3>
            <div class="card-meta">
              <span>${movie.year}</span>
              <span>${movie.genre}</span>
            </div>
            <button class="btn-details" data-id="${movie.id}">
              <i class="fas fa-info-circle"></i> Ver detalhes
            </button>
          </div>
        </div>
      `).join('');

      // Adicionar evento aos botões "Ver detalhes"
      document.querySelectorAll('.btn-details').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation(); // Impede que o clique no cartão dispare algo
          const id = Number(btn.dataset.id);
          openDetails(id);
        });
      });

      // NÃO adicionar evento de clique no cartão (conforme solicitado)
      // O clique no cartão não abre os detalhes automaticamente.
    }

    /* ============================================================
       ABRIR DETALHES (PÁGINA DE DETALHES)
    ============================================================ */
    function openDetails(movieId) {
      const movie = moviesData.find(m => m.id === movieId);
      if (!movie) return;

      detailsContent.innerHTML = `
        <button class="details-close" id="closeDetailsBtn"><i class="fas fa-times"></i></button>
        <div class="details-layout">
          <div class="details-poster">
            <img src="${movie.poster}" alt="Capa do filme ${movie.title}">
          </div>
          <div class="details-info">
            <h2>${movie.title}</h2>
            <div class="details-meta">
              <span><i class="far fa-calendar-alt"></i> ${movie.year}</span>
              <span><i class="fas fa-tag"></i> ${movie.genre}</span>
              <span><i class="far fa-clock"></i> ${movie.duration}</span>
              <span><i class="fas fa-star"></i> ${movie.rating}</span>
            </div>
            <p class="details-synopsis">${movie.synopsis}</p>
            <div class="details-actions">
              <button class="btn-watch" id="watchBtn"><i class="fas fa-play"></i> Assistir</button>
              <button class="btn-back" id="backBtn"><i class="fas fa-arrow-left"></i> Voltar</button>
            </div>
          </div>
        </div>
      `;

      detailsModal.classList.add('open');

      // Botão fechar (X)
      document.getElementById('closeDetailsBtn').addEventListener('click', closeDetails);
      // Botão voltar
      document.getElementById('backBtn').addEventListener('click', closeDetails);
      // Botão assistir (demo)
      document.getElementById('watchBtn').addEventListener('click', () => {
        alert(`🎬 Você está assistindo "${movie.title}" (demonstração). Nenhum conteúdo real é reproduzido.`);
      });
    }

    function closeDetails() {
      detailsModal.classList.remove('open');
    }

    // Fechar modal clicando fora
    detailsModal.addEventListener('click', (e) => {
      if (e.target === detailsModal) {
        closeDetails();
      }
    });

    /* ============================================================
       FILTRO POR CATEGORIA
    ============================================================ */
    categoriesFilter.addEventListener('click', (e) => {
      const btn = e.target.closest('.cat-btn');
      if (!btn) return;

      // Atualizar classe ativa
      document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');

      // Atualizar categoria e renderizar
      currentCategory = btn.dataset.category;
      renderMovies();
    });

    /* ============================================================
       PESQUISA
    ============================================================ */
    function performSearch() {
      currentSearchTerm = searchInput.value.trim();
      renderMovies();
    }

    searchBtn.addEventListener('click', performSearch);
    searchInput.addEventListener('keyup', (e) => {
      if (e.key === 'Enter') {
        performSearch();
      }
    });

    // Limpar pesquisa se o campo for esvaziado e pressionar Enter? Já tratado.
    // Opcional: buscar em tempo real? O enunciado pede "pesquisa funcional para filtrar filmes pelo título".
    // Vou adicionar também input em tempo real com debounce leve? Mas para manter simples, o botão já funciona.
    // Adicionarei evento 'input' com um pequeno atraso para melhor usabilidade.
    let searchTimeout;
    searchInput.addEventListener('input', () => {
      clearTimeout(searchTimeout);
      searchTimeout = setTimeout(() => {
        currentSearchTerm = searchInput.value.trim();
        renderMovies();
      }, 300);
    });

    /* ============================================================
       MENU RESPONSIVO
    ============================================================ */
    menuToggle.addEventListener('click', () => {
      mainNav.classList.toggle('active');
    });

    // Fechar menu ao clicar em um link (opcional)
    document.querySelectorAll('nav a').forEach(link => {
      link.addEventListener('click', () => {
        mainNav.classList.remove('active');
      });
    });

    /* ============================================================
       BOTÃO EXPLORAR (HERO)
    ============================================================ */
    heroExploreBtn.addEventListener('click', () => {
      // Rola suavemente até a grelha de filmes
      document.querySelector('.section-title').scrollIntoView({ behavior: 'smooth' });
    });

    /* ============================================================
       INICIALIZAÇÃO
    ============================================================ */
    renderMovies();
  </script>
</body>
</html>
